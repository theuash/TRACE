[project]
name = "filing-auditor"
version = "0.1.0"
description = "Human-in-the-Loop Financial Filing Auditor Agent (MineArena 1.0, PS-01)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent workflow + persistence
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    # Backend
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Frontend
    "streamlit>=1.35",
    "streamlit-autorefresh>=1.0",
    "plotly>=5.20",
    # Data / parsing
    "httpx>=0.27",
    "selectolax>=0.3",
    "lxml>=5.0",
    "pandas>=2.2",
    # Schemas / config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # LLM: one OpenAI-compatible client talks to Ollama, Groq and Gemini
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "extraction", "validation", "ui", "shared", "demo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
